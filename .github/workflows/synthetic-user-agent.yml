name: WashRadar synthetic user agent

on:
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *'
  workflow_run:
    workflows: ["Deploy WashRadar to GitHub Pages"]
    types: [completed]
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/synthetic-user-agent.yml'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'

permissions:
  contents: read

concurrency:
  group: synthetic-user-agent-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test-like-a-user:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WASHRADAR_URL: ${{ github.event_name == 'pull_request' && 'http://localhost:4173' || 'https://washradar.ca' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Hydrate deployed address index for PR preview
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          # The repository intentionally keeps only a tiny city fallback. Production
          # deployment builds the richer ODA/FSA index. Pull that deployed static index
          # into the local candidate so postal-search behavior matches production without
          # relying on cross-origin browser fetches.
          curl --fail --silent --show-error --location \
            https://washradar.ca/address-index/areas.json \
            --output public/address-index/areas.json

      - name: Build candidate app for PR testing
        if: github.event_name == 'pull_request'
        run: npm run build

      - name: Start candidate preview for PR testing
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm run preview > /tmp/washradar-preview.log 2>&1 &
          preview_pid=$!
          echo "PREVIEW_PID=$preview_pid" >> "$GITHUB_ENV"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$WASHRADAR_URL/" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/washradar-preview.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WashRadar synthetic user agent
        run: npx tsx scripts/synthetic-user-agent.ts

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f synthetic-user-results/report.md ]; then
            cat synthetic-user-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: washradar-synthetic-user-report-${{ github.run_id }}
          path: synthetic-user-results
          if-no-files-found: warn
          retention-days: 14
