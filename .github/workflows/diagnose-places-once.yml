name: Diagnose Google Places once

on:
  push:
    paths:
      - '.github/workflows/diagnose-places-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Call fixed Toronto car wash diagnostic
        run: curl --silent --show-error 'https://mwyomijlvjfllgeniqcz.supabase.co/functions/v1/places-diagnostic'
      - name: Remove diagnostic workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-places-once.yml
          git commit -m 'Remove one-time Places diagnostic'
          git push
