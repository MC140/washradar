name: Friends beta audit

on:
  push:
    branches: [release/friends-beta-hardening]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friends-beta-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-user-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static quality gate
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Deterministic end-to-end user journeys
        run: npm run test:e2e
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friends-beta-e2e
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
