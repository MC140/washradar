name: Quality checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run local demo end-to-end suite
        run: npm run test:e2e
      - name: Run production friend-release audit
        run: npx playwright test --config=playwright.production.config.ts
        env:
          PROD_BASE_URL: https://washradar.ca
      - name: Upload browser audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friend-release-browser-audit
          if-no-files-found: ignore
          retention-days: 7
          path: |
            playwright-report/
            playwright-report-production/
            test-results/
            test-results-production/
