name: Deploy WashRadar preview to Cloudflare Pages

on:
  push:
    branches:
      - infra/cloudflare-pages-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

jobs:
  build-deploy-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WASHRADAR_URL: https://cloudflare-preview.washradar.pages.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build zero-cost GTA postal index
        run: |
          mkdir -p .cache/postal
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --output .cache/postal/CA_full.csv.zip \
            https://download.geonames.org/export/zip/CA_full.csv.zip
          python3 scripts/build_gta_postal_index.py \
            --zip .cache/postal/CA_full.csv.zip \
            --output public/postal-index.json
          python3 - <<'PY'
          import json
          data=json.load(open('public/postal-index.json', encoding='utf-8'))
          keys={str(row[0]).lower() for row in data.get('areas', [])}
          assert 'm1x' in keys, 'M1X missing from postal index'
          assert len(keys) >= 100, f'postal index unexpectedly small: {len(keys)}'
          print(f'Postal index validated: {len(keys)} FSAs; M1X present')
          PY

      - name: Restore generated GTA address index
        id: address-index-cache
        uses: actions/cache@v4
        with:
          path: public/address-index
          key: gta-address-index-oda-on-v1-${{ hashFiles('scripts/build_gta_address_index_oda.py') }}

      - name: Restore Statistics Canada Ontario address source
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        id: address-source-cache
        uses: actions/cache@v4
        with:
          path: .cache/address-source
          key: statcan-oda-on-v1

      - name: Download Statistics Canada Ontario Open Database of Addresses
        if: steps.address-index-cache.outputs.cache-hit != 'true' && steps.address-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p .cache/address-source
          curl --fail --location --retry 4 --retry-delay 4 --connect-timeout 30 \
            --output .cache/address-source/ODA_ON_v1.zip \
            https://www150.statcan.gc.ca/n1/en/pub/46-26-0001/2021001/ODA_ON_v1.zip

      - name: Build zero-cost GTA address autocomplete index
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          if [ -s .cache/address-source/ODA_ON_v1.zip ]; then
            python3 scripts/build_gta_address_index_oda.py \
              --zip .cache/address-source/ODA_ON_v1.zip \
              --output public/address-index \
              --release ODA-ON-v1
          else
            echo "Ontario ODA unavailable; deploying built-in GTA city search and provider fallback."
          fi
          if [ -f public/address-index/manifest.json ]; then cat public/address-index/manifest.json; fi

      - name: Build static PWA
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_BASE_PATH: "/"
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_SUPPORT_EMAIL: support@washradar.ca
          VITE_MAP_TILE_URL: https://tile.openstreetmap.org/{z}/{x}/{y}.png
          VITE_MAP_ATTRIBUTION: © OpenStreetMap contributors
          VITE_QUEUE_REFRESH_MODE: poll
          VITE_QUEUE_POLL_MS: "20000"

      - name: Remove GitHub Pages-only CNAME artifact
        run: rm -f dist/CNAME

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/cf-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/washradar")"
          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages project 'washradar' already exists."
          elif [ "$status" = "404" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"washradar","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              > /tmp/cf-project-create.json
            echo "Created Cloudflare Pages project 'washradar'."
          else
            echo "Cloudflare project lookup failed with HTTP ${status}."
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.131.0 pages deploy dist \
            --project-name=washradar \
            --branch=cloudflare-preview \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Cloudflare Pages preview from GitHub Actions"

      - name: Wait for Cloudflare preview and verify static search assets
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --location "$WASHRADAR_URL/" >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "Cloudflare preview did not become reachable in time."
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent --show-error --location "$WASHRADAR_URL/postal-index.json" --output /tmp/postal-index.json
          curl --fail --silent --show-error --location "$WASHRADAR_URL/address-index/areas.json" --output /tmp/address-areas.json
          python3 - <<'PY'
          import json
          postal=json.load(open('/tmp/postal-index.json', encoding='utf-8'))
          keys={str(row[0]).lower() for row in postal.get('areas', [])}
          assert 'm1x' in keys, 'Cloudflare preview postal index is missing M1X'
          areas=json.load(open('/tmp/address-areas.json', encoding='utf-8'))
          assert areas, 'Cloudflare preview address-area index is empty'
          print(f'Cloudflare static indexes healthy: {len(keys)} postal FSAs')
          PY

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run WashRadar synthetic user agent against Cloudflare
        run: npx tsx scripts/synthetic-user-agent.ts

      - name: Verify saved location survives refresh on Cloudflare
        run: npx tsx scripts/location-persistence-user-agent.ts

      - name: Verify map markers and Search this area on Cloudflare
        run: npx tsx scripts/map-user-agent.ts

      - name: Verify structured WashRadar ratings on Cloudflare
        run: npx tsx scripts/ratings-user-agent.ts

      - name: Add report to workflow summary
        if: always()
        shell: bash
        run: |
          if [ -f synthetic-user-results/report.md ]; then
            cat synthetic-user-results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-preview-synthetic-report-${{ github.run_id }}
          path: synthetic-user-results
          if-no-files-found: warn
          retention-days: 14
