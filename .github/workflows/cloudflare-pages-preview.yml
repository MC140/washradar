name: Deploy WashRadar preview to Cloudflare Pages

on:
  push:
    branches:
      - infra/cloudflare-pages-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build zero-cost GTA postal index
        run: |
          mkdir -p .cache/postal
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --output .cache/postal/CA_full.csv.zip \
            https://download.geonames.org/export/zip/CA_full.csv.zip
          python3 scripts/build_gta_postal_index.py \
            --zip .cache/postal/CA_full.csv.zip \
            --output public/postal-index.json
          python3 - <<'PY'
          import json
          data=json.load(open('public/postal-index.json', encoding='utf-8'))
          keys={row[0] for row in data.get('areas', [])}
          assert 'm1x' in keys, 'M1X missing from postal index'
          assert len(keys) >= 100, f'postal index unexpectedly small: {len(keys)}'
          print(f'Postal index validated: {len(keys)} FSAs; M1X present')
          PY

      - name: Restore generated GTA address index
        id: address-index-cache
        uses: actions/cache@v4
        with:
          path: public/address-index
          key: gta-address-index-oda-on-v1-${{ hashFiles('scripts/build_gta_address_index_oda.py') }}

      - name: Restore Statistics Canada Ontario address source
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        id: address-source-cache
        uses: actions/cache@v4
        with:
          path: .cache/address-source
          key: statcan-oda-on-v1

      - name: Download Statistics Canada Ontario Open Database of Addresses
        if: steps.address-index-cache.outputs.cache-hit != 'true' && steps.address-source-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p .cache/address-source
          curl --fail --location --retry 4 --retry-delay 4 --connect-timeout 30 \
            --output .cache/address-source/ODA_ON_v1.zip \
            https://www150.statcan.gc.ca/n1/en/pub/46-26-0001/2021001/ODA_ON_v1.zip

      - name: Build zero-cost GTA address autocomplete index
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          if [ -s .cache/address-source/ODA_ON_v1.zip ]; then
            python3 scripts/build_gta_address_index_oda.py \
              --zip .cache/address-source/ODA_ON_v1.zip \
              --output public/address-index \
              --release ODA-ON-v1
          else
            echo "Ontario ODA unavailable; deploying built-in GTA city search and provider fallback."
          fi
          if [ -f public/address-index/manifest.json ]; then cat public/address-index/manifest.json; fi

      - name: Build static PWA
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_BASE_PATH: "/"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/cf-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/washradar")"
          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages project 'washradar' already exists."
          elif [ "$status" = "404" ]; then
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data '{"name":"washradar","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              > /tmp/cf-project-create.json
            echo "Created Cloudflare Pages project 'washradar'."
          else
            echo "Cloudflare project lookup failed with HTTP ${status}."
            cat /tmp/cf-project.json
            exit 1
          fi

      - name: Deploy preview to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.131.0 pages deploy dist \
            --project-name=washradar \
            --branch=cloudflare-preview \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="Cloudflare Pages preview from GitHub Actions"
