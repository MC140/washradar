name: Deploy WashRadar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The full civic-address index is static public data. Keep it out of Supabase so
      # normal address suggestions consume neither database capacity nor paid API calls.
      - name: Restore generated GTA address index
        id: address-index-cache
        uses: actions/cache@v4
        with:
          path: public/address-index
          key: gta-address-index-oda-on-v1-${{ hashFiles('scripts/build_gta_address_index.py') }}

      - name: Restore Statistics Canada Ontario ODA archive
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        id: oda-cache
        uses: actions/cache@v4
        with:
          path: .cache/oda
          key: statcan-oda-on-v1

      - name: Download Statistics Canada Ontario ODA
        if: steps.address-index-cache.outputs.cache-hit != 'true' && steps.oda-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p .cache/oda
          curl --fail --location --retry 4 --retry-delay 4 --connect-timeout 30 \
            --output .cache/oda/ODA_ON_v1.zip \
            https://www150.statcan.gc.ca/n1/en/pub/46-26-0001/2021001/ODA_ON_v1.zip

      - name: Build zero-cost GTA address autocomplete index
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          if [ -s .cache/oda/ODA_ON_v1.zip ]; then
            python3 scripts/build_gta_address_index.py \
              --zip .cache/oda/ODA_ON_v1.zip \
              --output public/address-index \
              --release ODA-ON-v1
          else
            echo "Ontario ODA unavailable; deploying the built-in GTA city index and retaining provider fallback."
          fi
          if [ -f public/address-index/manifest.json ]; then cat public/address-index/manifest.json; fi

      - name: Build static PWA
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_BASE_PATH: "/"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
