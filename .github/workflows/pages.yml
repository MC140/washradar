name: Deploy WashRadar to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Restore generated GTA address index
        id: address-index-cache
        uses: actions/cache@v4
        with:
          path: public/address-index
          key: gta-address-index-202606-${{ hashFiles('scripts/build_gta_address_index.py') }}

      - name: Restore Statistics Canada NAR source archive
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        id: nar-cache
        uses: actions/cache@v4
        with:
          path: .cache/nar
          key: statcan-nar-202606

      - name: Download Statistics Canada NAR June 2026
        if: steps.address-index-cache.outputs.cache-hit != 'true' && steps.nar-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/nar
          curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 \
            --output .cache/nar/202606.zip \
            https://www150.statcan.gc.ca/n1/pub/46-26-0002/2022001/202606.zip

      - name: Build zero-cost GTA address autocomplete index
        if: steps.address-index-cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/build_gta_address_index.py \
            --zip .cache/nar/202606.zip \
            --output public/address-index \
            --release 202606
          cat public/address-index/manifest.json

      - name: Build static PWA
        run: npm run build
        env:
          VITE_DEMO_MODE: "false"
          VITE_BASE_PATH: "/"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.VITE_GOOGLE_MAPS_BROWSER_KEY }}
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_MAP_TILE_URL: ${{ vars.VITE_MAP_TILE_URL }}
          VITE_MAP_ATTRIBUTION: ${{ vars.VITE_MAP_ATTRIBUTION }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
