name: Productionize GTA catalogue once

on:
  push:
    paths:
      - '.github/workflows/productionize-gta-once.yml'

permissions:
  contents: write

jobs:
  productionize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Switch frontend to stable JSON nearby-wash RPC
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/services/supabaseRepository.ts')
          text = p.read_text()
          old = "this.client.rpc('nearby_washes', {p_lat: origin.lat, p_lng: origin.lng, p_radius_km: radiusKm})"
          new = "this.client.rpc('nearby_washes_json', {p_lat: origin.lat, p_lng: origin.lng, p_radius_km: radiusKm})"
          if old not in text and new not in text:
              raise SystemExit('Expected nearby-washes RPC call was not found')
          p.write_text(text.replace(old, new))
          PY

      - name: Bootstrap fixed GTA catalogue in resumable batches
        run: |
          set -euo pipefail
          URL='https://mwyomijlvjfllgeniqcz.supabase.co/functions/v1/catalogue-bootstrap-run'
          for i in 1 2 3 4 5 6; do
            echo "Bootstrap batch $i"
            body=$(curl --fail-with-body --silent --show-error "$URL")
            echo "$body"
            if echo "$body" | grep -q '"done":true'; then
              break
            fi
            sleep 2
          done

      - name: Remove one-time workflow and commit frontend production change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/productionize-gta-once.yml
          git add src/services/supabaseRepository.ts
          git commit -m 'Use stable nearby wash RPC and complete GTA bootstrap'
          git push
