name: Diagnose catalogue insert once
on:
  push:
    paths:
      - '.github/workflows/diagnose-db-once.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose one Google result insert
        run: curl --silent --show-error 'https://mwyomijlvjfllgeniqcz.supabase.co/functions/v1/places-diagnostic'
      - name: Remove diagnostic workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diagnose-db-once.yml
          git commit -m 'Remove catalogue insert diagnostic'
          git push
