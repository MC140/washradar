name: Friends release audit

on:
  push:
    branches: [audit/friends-release-2026-09-09]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static quality gate
        run: npm run check
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Deterministic demo write-flow end-to-end suite
        run: npm run test:e2e
      - name: Live production read-only end-to-end audit
        run: npx playwright test --config=playwright.live.config.ts
      - name: Upload Playwright audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: friends-release-live-audit
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 3
